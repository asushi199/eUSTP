name: Uji sambungan ESN & DCS

# Ujian sekali sahaja: adakah pelari GitHub Actions boleh mencapai halaman log masuk
# esn.moe.edu.my dan dcs.moe.edu.my? Tiada log masuk, tiada rahsia digunakan.
on:
  workflow_dispatch:

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lokasi pelari
        run: curl -sS --max-time 15 https://ipinfo.io/country || true

      - name: DNS
        run: |
          getent hosts dcs.moe.edu.my || echo "DNS dcs gagal"
          getent hosts esn.moe.edu.my || echo "DNS esn gagal"

      - name: DCS (http)
        run: |
          for i in 1 2 3; do
            curl -sS --max-time 30 -o dcs.html -w "DCS status=%{http_code} masa=%{time_total}s ip=%{remote_ip}\n" \
              http://dcs.moe.edu.my/login && break
            echo "cubaan $i gagal"; sleep 10
          done
          [ -f dcs.html ] && sed -e 's/<[^>]*>/ /g' dcs.html | tr -s ' \n' ' ' | head -c 300; echo

      - name: ESN (https, sijil disemak)
        run: |
          curl -sS --max-time 30 -o /dev/null -w "ESN status=%{http_code} ssl_verify=%{ssl_verify_result}\n" \
            https://esn.moe.edu.my/admin/login || echo "ESN dengan semakan sijil gagal (dijangka: rantai sijil tidak lengkap)"

      - name: ESN (https, tanpa semakan sijil — uji capaian sahaja)
        run: |
          for i in 1 2 3; do
            curl -sS -k --max-time 30 -o esn.html -w "ESN status=%{http_code} masa=%{time_total}s ip=%{remote_ip}\n" \
              https://esn.moe.edu.my/admin/login && break
            echo "cubaan $i gagal"; sleep 10
          done
          [ -f esn.html ] && sed -e 's/<[^>]*>/ /g' esn.html | tr -s ' \n' ' ' | head -c 300; echo

      - name: Rantai sijil ESN
        run: echo | openssl s_client -connect esn.moe.edu.my:443 -servername esn.moe.edu.my 2>/dev/null | grep -E "^ *[0-9] s:|^ *i:|Verify return" || true
